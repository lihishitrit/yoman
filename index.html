<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>היומן שלי</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="היומן שלי">
<meta name="theme-color" content="#FBF8F1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBF8F1;--card:#FFFDF8;--line:#E5DDCC;--line2:#EEE7D8;--ink:#2B2A28;--muted:#6B665C;--faint:#8A8478;
  --accent:#DA84B1;--accent-ink:#A84C80;--accent-soft:#FBEFF5;--seg:#EFE8DA;--done:#77726A;--danger:#B23A3A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:Heebo,system-ui,-apple-system,sans-serif;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;padding:0;margin:0;cursor:pointer;text-align:inherit}
input,textarea{font-family:inherit}
svg{display:block}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
#view{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
h1{margin:0;font-size:32px;font-weight:800;line-height:1.1;letter-spacing:-.3px}
h2{margin:0;font-size:18px;font-weight:800}
.sub{font-size:13px;color:var(--muted)}
.hdr{display:flex;justify-content:space-between;align-items:flex-end;padding:14px 16px 10px;gap:8px;flex:none}
.hdr-actions{display:flex;align-items:center;gap:2px}
.icon-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:22px}
.icon-btn:active{background:var(--seg)}
.pill{height:32px;padding:0 14px;border:1px solid #D9D0BE;border-radius:16px;background:var(--card);font-size:13px;font-weight:500}
.chips{display:flex;gap:6px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:16px;border:1px solid #E2D9C7;background:var(--card);font-size:13px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);font-weight:700}
.dot{width:9px;height:9px;border-radius:2px;flex:none;display:inline-block}
.dot.t{border-radius:5px}
.legend{display:flex;gap:14px;padding:0 16px 8px;font-size:11px;color:var(--muted);flex:none}
.legend span{display:flex;align-items:center;gap:5px}
.lg-ev{width:16px;height:9px;border-radius:2px;background:#E3ECF5}
.lg-tk{width:9px;height:9px;border-radius:2px;border:1.5px solid var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px;padding:3px;border-radius:10px;background:var(--seg);height:38px;flex:none}
.seg button{border-radius:8px;font-size:13px;color:var(--muted);text-align:center;padding:0 10px}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(43,42,40,.15)}
/* month */
.wk-head{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:0 4px;border-bottom:1px solid var(--line);flex:none}
.wk-head div{text-align:center;font-size:12px;font-weight:500;color:var(--muted);padding:2px 0 6px}
.mgrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:0 4px}
.mcell{display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:3px 2px;border-bottom:1px solid var(--line);border-left:1px solid var(--line2);overflow:hidden;min-width:0;min-height:0}
.mcell:nth-child(7n){border-left:none}
.mcell.sat{background:#F7F2E7}
.mcell.today{background:var(--accent-soft)}
.mcell.out .mnum{color:#B3AC9E}
.mcell.out .mev,.mcell.out .mtk{opacity:.55}
.mnum{align-self:center;height:24px;min-width:24px;padding:0 4px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;border-radius:12px;flex:none}
.mcell.today .mnum{background:var(--accent);font-weight:800}
.mev{display:block;height:15px;flex:none;border-radius:3px;padding:0 3px;font-size:10px;line-height:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtk{display:flex;align-items:center;gap:3px;height:15px;flex:none;padding:0 1px;font-size:10px;line-height:15px;white-space:nowrap;overflow:hidden}
.mtk i{flex:none;width:9px;height:9px;border:1.5px solid;border-radius:2px}
.mtk span{overflow:hidden;text-overflow:ellipsis}
.mtk.done span{text-decoration:line-through;color:var(--done)}
.more{font-size:10px;font-weight:700;color:var(--muted);padding:0 3px;flex:none}
/* week */
.whdr{flex-wrap:wrap;align-items:center;row-gap:6px}
.wctl{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:1 1 auto}
.wtitle{display:flex;align-items:baseline;gap:8px;flex:1 1 auto}
.wtitle h1{font-size:26px}
.wgrid{flex:1;min-height:0;overflow-y:auto;border-top:1px solid var(--line)}
.wday{display:flex;border-bottom:1px solid var(--line2);min-height:62px}
.wday.today{background:var(--accent-soft)}
.wday-h{flex:none;width:58px;display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px;border-left:1px solid var(--line2)}
.wday-h span{font-size:12px;color:var(--muted)}
.wday-h b{width:30px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
.wday.today .wday-h b{background:var(--accent)}
.wday-b{flex:1;min-width:0;padding:6px 8px;display:flex;flex-direction:column;gap:4px}
.wev{display:flex;gap:6px;align-items:baseline;border-radius:6px;padding:4px 8px;width:100%;min-width:0}
.wev small{font-size:11px;font-variant-numeric:tabular-nums;flex:none}
.wev span{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sep{border-top:1px dashed #D9D0BE;margin:2px 0}
.wtk{display:flex;align-items:flex-start;gap:6px;min-width:0}
.wtk-t{flex:1;min-width:0;display:flex;flex-direction:column}
.wtk-t span{font-size:13px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wtk-t small{font-size:11px;line-height:14px;font-variant-numeric:tabular-nums}
.wtk.done .wtk-t span{text-decoration:line-through;color:var(--done)}
.empty{font-size:12px;color:var(--faint);padding:6px 0}
/* checkbox */
.cbw{flex:none;width:36px;height:36px;margin:-7px;display:flex;align-items:center;justify-content:center}
.cb{width:22px;height:22px;border-radius:6px;border:1.8px solid var(--c);display:flex;align-items:center;justify-content:center;background:transparent}
.cb svg{opacity:0}
.cb.on{background:var(--c)}
.cb.on svg{opacity:1}
.cb.sm{width:16px;height:16px;border-radius:4px;border-width:1.6px}
/* day */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:0 10px 6px;border-bottom:1px solid var(--line);flex:none}
.strip button{height:52px;display:flex;flex-direction:column;align-items:center;gap:2px}
.strip span{font-size:11px;color:var(--muted)}
.strip b{width:30px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
.strip .is-today b{color:var(--accent-ink)}
.strip .on b{background:var(--accent);color:var(--ink)}
.prog{display:flex;align-items:center;gap:10px;padding:8px 16px 4px;font-size:12px;color:var(--muted);flex:none}
.bar{flex:1;height:5px;border-radius:3px;background:#EAE2D1;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.allday{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 8px;flex:none}
.allday button{height:28px;border-radius:6px;padding:0 10px;font-size:12px;font-weight:600}
.lanes{display:flex;font-size:11px;font-weight:500;color:var(--muted);height:18px;padding:0 16px;flex:none}
.tl{flex:none;height:40%;min-height:180px;overflow-y:auto;margin:0 16px;position:relative;border-bottom:1px solid var(--line2)}
.tl-in{position:relative;margin-top:8px}
.hr{position:absolute;right:0;left:0;height:0}
.hr span{position:absolute;right:0;top:-7px;width:36px;font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}
.hr i{position:absolute;right:40px;left:0;border-top:1px solid var(--line2)}
.ev-area{position:absolute;top:0;bottom:0;right:44px}
.ev{position:absolute;border-radius:6px;padding:2px 7px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.ev b{font-size:12px;line-height:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev small{font-size:10px;line-height:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rt-area{position:absolute;top:0;bottom:0;left:0}
.rt{position:absolute;right:0;left:0;border-radius:6px;border:1.5px dashed var(--c);background:var(--card);padding:3px 5px;display:flex;flex-direction:column;gap:1px;overflow:hidden}
.rt-top{display:flex;align-items:center;gap:5px;min-width:0}
.rt-top span{font-size:11px;font-weight:600;line-height:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rt small{font-size:10px;color:var(--c);font-variant-numeric:tabular-nums}
.rt.done .rt-top span{text-decoration:line-through;color:var(--done)}
.now{position:absolute;right:36px;left:0;border-top:1.5px solid #C2412D;pointer-events:none;z-index:3}
.now::before{content:'';position:absolute;right:-4px;top:-4.5px;width:7px;height:7px;border-radius:4px;background:#C2412D}
.sec-h{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 2px;flex:none}
.link{color:var(--accent-ink);font-size:13px;font-weight:600;min-height:36px;display:flex;align-items:center}
.list{padding:0 16px 16px}
.trow{display:flex;align-items:center;gap:10px;min-height:50px;border-bottom:1px solid var(--line2)}
.tt{flex:1;min-width:0;display:flex;flex-direction:column;padding:5px 0}
.tt span{font-size:15px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt small{font-size:11px;line-height:15px;color:var(--muted);display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden}
.tt small.late{color:var(--danger)}
.trow.done .tt span{text-decoration:line-through;color:var(--done)}
.del{width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex:none}
.emptybox{padding:22px 4px;text-align:center;color:var(--faint);font-size:14px;line-height:1.6}
/* tasks page */
.quick{display:flex;gap:8px;padding:0 16px 10px;flex:none}
.quick .inp{flex:1}
.qcat{width:46px;height:46px;border-radius:10px;border:1px solid #DED5C3;display:flex;align-items:center;justify-content:center;flex:none}
.qadd{width:46px;height:46px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.tbar{display:flex;gap:8px;align-items:center;padding:0 16px 6px;flex:none}
.tbar .seg{flex:1}
.ghead{display:flex;align-items:center;gap:8px;height:38px;margin-top:6px}
.ghead h2{font-size:17px}
.gicon{width:26px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none}
.count{font-size:12px;color:var(--muted)}
/* categories */
.card{background:var(--card);border:1px solid #EAE2D1;border-radius:12px;overflow:hidden}
.crow{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 12px;border-bottom:1px solid #F0EADD}
.crow:last-child{border-bottom:none}
.crow.off{opacity:.5}
.cicon{width:34px;height:34px;border-radius:17px;display:flex;align-items:center;justify-content:center;flex:none}
.cname{flex:1;min-width:0;display:flex;flex-direction:column;padding:6px 0}
.cname span{font-size:15px;font-weight:600}
.cname small{font-size:11px;color:var(--muted)}
.shead{display:flex;justify-content:space-between;align-items:center;height:40px;margin-top:8px}
.shead h2 small{font-size:11px;font-weight:400;color:var(--muted);margin-right:6px}
.sw{width:44px;height:26px;border-radius:13px;background:#D6CDBB;padding:3px;display:flex;justify-content:flex-start;flex:none;transition:background .15s}
.sw.on{background:var(--accent);justify-content:flex-end}
.sw i{width:20px;height:20px;border-radius:10px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.swbtn{width:52px;height:44px;display:flex;align-items:center;justify-content:center;flex:none}
.info{font-size:13px;line-height:1.6;color:var(--muted);padding:12px 14px}
.info b{color:var(--ink)}
.brow{display:flex;gap:8px;padding:0 14px 14px}
/* tabbar */
#tabbar{flex:none;display:flex;justify-content:space-around;align-items:flex-start;padding:6px 4px calc(env(safe-area-inset-bottom) + 4px);border-top:1px solid var(--line);background:var(--paper)}
.tab{width:58px;min-height:48px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}
.tab.on{color:var(--accent-ink);font-weight:700}
.fab{width:52px;height:52px;margin-top:-16px;border-radius:26px;background:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(218,132,177,.45);flex:none}
/* sheet */
#backdrop{position:fixed;inset:0;background:rgba(43,42,40,.45);display:none;z-index:50;align-items:flex-end;justify-content:center}
#backdrop.open{display:flex}
#sheet{width:100%;max-width:560px;max-height:92%;overflow-y:auto;background:var(--card);border-radius:22px 22px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.handle{align-self:center;width:38px;height:5px;border-radius:3px;background:#DED5C3;flex:none}
.sh-top{display:flex;justify-content:space-between;align-items:center}
.sh-top h2{font-size:22px}
.field{display:flex;flex-direction:column;gap:6px}
.lbl{font-size:12px;font-weight:500;color:var(--muted)}
.inp{height:46px;border:1px solid #DED5C3;border-radius:10px;background:var(--paper);padding:0 12px;font-size:16px;color:var(--ink);width:100%;-webkit-appearance:none;appearance:none;outline:none;min-width:0}
.inp:focus{border-color:var(--accent)}
.inp::placeholder{color:var(--faint)}
textarea.inp{height:70px;padding:10px 12px;resize:none;line-height:1.4}
input[type=date].inp,input[type=time].inp{display:flex;align-items:center;text-align:right}
input::-webkit-date-and-time-value{text-align:right}
.row{display:flex;gap:10px;align-items:center}
.row > *{flex:1;min-width:0}
.swrow{display:flex;justify-content:space-between;align-items:center;height:46px;border:1px solid #DED5C3;border-radius:10px;background:var(--paper);padding:0 12px;font-size:15px;width:100%}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{height:38px;padding:0 12px;border-radius:19px;border:1px solid #E2D9C7;background:var(--card);font-size:14px;display:flex;align-items:center;gap:6px}
.opt.on{border:2px solid var(--c,var(--accent));background:var(--cb,var(--accent-soft));font-weight:600}
.opt:disabled{opacity:.4}
.opt.add{border:1.5px dashed #B8AE9A;color:var(--muted);font-size:13px}
.note{display:flex;gap:8px;padding:10px 12px;border-radius:10px;background:#F4EEDF;font-size:12px;line-height:17px;color:#5E594F}
.btn{height:52px;border-radius:14px;background:var(--accent);font-size:16px;font-weight:800;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;flex:none}
.btn.ghost{background:transparent;border:1px solid #E2D9C7;font-weight:500;height:46px;font-size:15px}
.btn.danger{background:transparent;color:var(--danger);font-weight:600;height:44px;font-size:15px}
.swatches{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.swatch{height:40px;border-radius:20px;border:2px solid transparent;padding:3px}
.swatch i{display:block;width:100%;height:100%;border-radius:16px}
.swatch.on{border-color:var(--ink)}
.icons{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.icons button{height:40px;border-radius:10px;border:1px solid #EAE2D1;display:flex;align-items:center;justify-content:center;background:var(--paper)}
.icons button.on{border:1.5px solid var(--c);background:var(--cb)}
#toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 86px);left:50%;transform:translate(-50%,20px);background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;display:flex;gap:16px;align-items:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:90%;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:var(--accent);font-weight:700}
@media (orientation:landscape){
  .wgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));overflow:hidden}
  .wday{flex-direction:column;border-bottom:none;border-left:1px solid var(--line2);min-height:0;overflow-y:auto}
  .wday:last-child{border-left:none}
  .wday-h{width:auto;flex-direction:row;justify-content:center;border-left:none;padding:6px 0;gap:6px}
  .wday-b{padding:4px 5px}
  .wev{flex-direction:column;gap:0;padding:3px 6px}
  .wev span{font-size:12px;width:100%}
  .wtk-t span{font-size:12px}
}
@media (orientation:landscape) and (max-height:520px){
  .tab span{display:none}
  .tab{min-height:38px;justify-content:center}
  .fab{width:42px;height:42px;margin-top:0}
  #tabbar{padding-top:3px}
  .hdr{padding-top:6px;padding-bottom:6px}
  h1{font-size:24px}
  .chips{padding-bottom:6px}
  .tl{height:46%}
  .legend{display:none}
  .hdr .sub{font-size:12px}
}
</style>
</head>
<body>
<div id="app">
  <main id="view"></main>
  <nav id="tabbar" aria-label="ניווט ראשי"></nav>
</div>
<div id="backdrop" data-action="backdrop"><div id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
'use strict';
/* ---------- constants ---------- */
const PAL = [
  ['#2F5D8A','#E3ECF5','כחול'],['#3F5F8F','#E2E8F2','כחול אפור'],['#2E6E52','#DFEEE6','ירוק'],['#56632A','#E9EDD9','זית'],
  ['#8A6116','#F3EAD4','חרדל'],['#9C4F2A','#F5E6DA','חום'],['#A8404F','#F5E1E4','אדום'],['#7E4A93','#EEE3F2','סגול'],
  ['#A84C80','#F8E6EF','ורוד'],['#555B66','#E6E7EA','אפור']
];
const IC = {
  work:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/>',
  fam:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 4.8a3 3 0 0 1 0 6M18 14.6c1.8.8 3 2.8 3 5.4"/>',
  health:'<path d="M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.2a4.2 4.2 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/>',
  me:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',
  home:'<path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/>',

/* ---------- month ---------- */
function renderMonth(V) {

    '<div class="wk-head">' + DS.map((x) => '<div>' + x + '</div>').join('') + '</div>' +
    '<div class="mgrid" id="mgrid" style="grid-template-rows:repeat(' + rows + ',minmax(0,1fr))"></div>';

      const more = its.length - show.length;
      h += '<button class="mcell' + (out ? ' out' : '') + (ds === T ? ' today' : '') + (dd.getDay() === 6 ? ' sat' : '') + '" data-action="open-day" data-date="' + ds + '" aria-label="' + dd.getDate() + ' ' + MONTHS[dd.getMonth()] + ', ' + its.length + ' פריטים"><span class="mnum">' + dd.getDate() + '</span>' +
        show.map((it) => {
          const p = pal(cat(it.cat));
          return it.type === 'event'
            ? '<span class="mev" style="background:' + p[1] + ';color:' + p[0] + '">' + esc(it.title) + '</span>'
            : '<span class="mtk' + (it.done ? ' done' : '') + '"><i style="border-color:' + p[0] + (it.done ? ';background:' + p[0] : '') + '"></i><span>' + esc(it.title) + '</span></span>';

}

/* ---------- day ---------- */
function layoutCols(list) {
  list.sort((a, b) => a.s - b.s || b.e - a.e);
  let cl = [], cur = [], end = -1;
  for (const x of list) { if (cur.length && x.s >= end) { cl.push(cur); cur = []; end = -1; } cur.push(x); end = Math.max(end, x.e); }
  if (cur.length) cl.push(cur);

  return list;
}
function renderDay(V) {

  const hasRT = ranged.length > 0;
  const nowM = new Date().getHours() * 60 + new Date().getMinutes();

    '<div class="strip">' + strip + '</div>' +
    (tk.length ? '<div class="prog"><span>' + nDone + ' מתוך ' + tk.length + ' משימות בוצעו</span><div class="bar"><i style="width:' + Math.round(nDone / tk.length * 100) + '%"></i></div></div>' : '<div style="height:8px;flex:none"></div>') +

    (ds === T ? '<div class="now" style="top:' + nowM / 60 * HOUR_PX + 'px"></div>' : '') + '</div></div>' +
    '<div class="sec-h"><h2>משימות היום</h2><button class="link" data-action="add-task">+ משימה</button></div>' +

  if (!UI.showOldDone) tasks = tasks.filter((t) => !(t.done && t.date && t.date < T));
  const byDate = (a, b) => (a.done - b.done) || ((a.date || '9999') < (b.date || '9999') ? -1 : (a.date || '9999') > (b.date || '9999') ? 1 : 0) || ((tmin(a.start) ?? 9999) - (tmin(b.start) ?? 9999));
  tasks.sort(byDate);

    groups = catsOf('task').filter((c) => !DB.hidden.includes(c.id)).map((c) => ({ c, title: c.name, rows: tasks.filter((t) => t.cat === c.id) }));
    const orphan = tasks.filter((t) => !cat(t.cat));
    if (orphan.length) groups.push({ title: 'ללא קטגוריה', rows: orphan });
  } else if (UI.taskMode === 'days') {
    const late = tasks.filter((t) => !t.done && t.date && t.date < T);
    const pastDone = tasks.filter((t) => t.done && t.date && t.date < T);
    const dates = [...new Set(tasks.filter((t) => t.date && t.date >= T).map((t) => t.date))].sort();
    if (late.length) groups.push({ title: 'באיחור', rows: late });
    dates.forEach((s) => groups.push({ title: s === T ? 'היום · ' + dshort(s) : s === addDays(T, 1) ? 'מחר · ' + dshort(s) : 'יום ' + DAYS[parse(s).getDay()] + ' · ' + parse(s).getDate() + '/' + (parse(s).getMonth() + 1), rows: tasks.filter((t) => t.date === s) }));
    const nd = tasks.filter((t) => !t.date);
    if (nd.length) groups.push({ title: 'ללא תאריך', rows: nd });
    if (pastDone.length) groups.push({ title: 'בוצעו בעבר', rows: pastDone });
  } else {
    groups = [{ title: 'כל המשימות', rows: tasks }];
  }
  groups = groups.filter((g) => g.rows.length);
  const open = tasks.filter((t) => !t.done).length, done = tasks.length - open;
  const qc = cat(DB.lastTaskCat) || catsOf('task')[0];

    '<form class="quick" data-form="quick" autocomplete="off"><button type="button" class="qcat" data-action="quick-cat" aria-label="קטגוריה: ' + esc(qc ? qc.name : '') + '">' + (qc ? icon(qc.icon, pal(qc)[0], 20) : '') + '</button>' +
    '<label for="quick" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">משימה חדשה</label><input id="quick" class="inp" enterkeyhint="done" placeholder="משימה מהירה להיום' + (qc ? ' · ' + esc(qc.name) : '') + '…"><button type="submit" class="qadd" aria-label="הוסף משימה">' + PLUS + '</button></form>' +
    '<div class="tbar"><div class="seg">' + [['all', 'הכל'], ['cats', 'קטגוריות'], ['days', 'ימים']].map((m) => '<button data-action="task-mode" data-v="' + m[0] + '" class="' + (UI.taskMode === m[0] ? 'on' : '') + '">' + m[1] + '</button>').join('') + '</div></div>' +
    '<div style="padding:0 16px 4px;flex:none"><button class="chip ' + (UI.showOldDone ? 'on' : '') + '" data-action="old-done" style="height:28px;font-size:12px">' + (UI.showOldDone ? 'מוצגות גם משימות ישנות שבוצעו' : 'הצג משימות ישנות שבוצעו') + '</button></div>' +
    '<div class="scroll"><div class="list">' + (groups.length ? groups.map((g) => {
      const p = g.c ? pal(g.c) : null;
      return '<div class="ghead">' + (g.c ? '<span class="gicon" style="background:' + p[1] + '">' + icon(g.c.icon, p[0], 15) + '</span>' : '') + '<h2>' + esc(g.title) + '</h2><span class="count">' + g.rows.length + '</span></div>' + g.rows.map((t) => taskRow(t, UI.taskMode)).join('');

/* ---------- reminders (.ics) ---------- */
function icsEsc(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }

    if (allDay) trig = it.rem >= 1440 ? '-PT15H' : 'PT9H';

  a.href = url; a.target = '_blank'; a.rel = 'noopener';
  if (!/iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent) || !('ontouchend' in document)) a.download = (it.title || 'event').slice(0, 40) + '.ics';
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- backup ---------- */
async function exportData() {
  const name = 'yoman-backup-' + today() + '.json';
  const blob = new Blob([JSON.stringify(DB, null, 1)], { type: 'application/json' });
  try {
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'גיבוי היומן' }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
$('#importFile').addEventListener('change', (e) => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.cats) || !Array.isArray(d.items)) throw new Error('bad');
      const prev = DB; DB = d; DB.hidden = DB.hidden || []; save(); render();
      toast('שוחזרו ' + d.items.length + ' פריטים', 'ביטול', () => { DB = prev; save(); render(); });
    } catch (err) { toast('הקובץ לא תקין'); }
    e.target.value = '';
  };
  r.readAsText(f);
});

/* ---------- toast ---------- */
let toastT = null;
function toast(msg, actLabel, fn) {
  const t = $('#toast');
  t.innerHTML = '<span>' + esc(msg) + '</span>' + (actLabel ? '<button id="toastAct">' + esc(actLabel) + '</button>' : '');
  t.classList.add('show');
  if (actLabel) $('#toastAct').onclick = () => { fn(); t.classList.remove('show'); };
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), actLabel ? 5000 : 2200);
}

/* ---------- actions ---------- */
function shift(n) {
  if (UI.view === 'month') { const d = parse(UI.date); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); const dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(day, dim)); UI.date = iso(d); }
  else if (UI.view === 'week') UI.date = addDays(UI.date, 7 * n);
  else if (UI.view === 'day') UI.date = addDays(UI.date, n);
  render();
}
const ACT = {
  prev: () => shift(-1), next: () => shift(1),
  today: () => { UI.date = today(); render(); },
  view: (el) => { UI.view = el.dataset.v; render(); $('#view').scrollTop = 0; },
  'open-day': (el) => { UI.date = el.dataset.date; UI.view = 'day'; render(); },
  'go-date': (el) => { UI.date = el.dataset.date; render(); },
  'chip-all': () => { UI.chips = []; render(); },
  chip: (el) => { const id = el.dataset.id; UI.chips = UI.chips.includes(id) ? UI.chips.filter((x) => x !== id) : UI.chips.concat(id); render(); },
  edit: (el) => editItem(el.dataset.id),
  toggle: (el) => {
    const it = DB.items.find((i) => i.id === el.dataset.id); if (!it) return;
    it.done = !it.done; save();
    if (F && F.id === it.id) F.done = it.done;
    render();
  },
  add: () => newItem(UI.view === 'tasks' ? 'task' : 'event'),
  'add-task': () => newItem('task', { date: UI.date }),
  'tl-add': (el, e) => {
    const r = el.getBoundingClientRect(); const h = Math.max(0, Math.min(23, Math.floor((e.clientY - r.top) / HOUR_PX)));
    newItem('event', { date: UI.date, hour: h });
  },
  del: (el) => {
    const i = DB.items.findIndex((x) => x.id === el.dataset.id); if (i < 0) return;
    const [it] = DB.items.splice(i, 1); save(); render();
    toast('"' + it.title + '" נמחקה', 'ביטול', () => { DB.items.splice(i, 0, it); save(); render(); });
  },
  'task-mode': (el) => { UI.taskMode = el.dataset.v; render(); },
  'old-done': () => { UI.showOldDone = !UI.showOldDone; render(); },
  'quick-cat': () => {
    const ts = catsOf('task'); if (!ts.length) return;
    const i = ts.findIndex((c) => c.id === DB.lastTaskCat);
    DB.lastTaskCat = ts[(i + 1) % ts.length].id; save();
    const v = $('#quick').value; render(); $('#quick').value = v;
    toast('קטגוריה: ' + cat(DB.lastTaskCat).name);
  },
  'new-cat': (el) => openCat(null, el.dataset.type),
  'edit-cat': (el) => openCat(el.dataset.id),
  'toggle-cat': (el) => { const id = el.dataset.id; DB.hidden = DB.hidden.includes(id) ? DB.hidden.filter((x) => x !== id) : DB.hidden.concat(id); UI.chips = UI.chips.filter((x) => x !== id); save(); render(); },
  export: () => exportData(),
  import: () => $('#importFile').click(),
  backdrop: (el, e) => { if (e.target === el) { if (CF_RETURN) { F = CF_RETURN; CF = null; CF_RETURN = null; sheetItem(); } else closeSheet(); } },
  'sheet-close': () => closeSheet(),
  'cat-close': () => { if (CF_RETURN) { F = CF_RETURN; CF = null; CF_RETURN = null; sheetItem(); } else closeSheet(); },
  'f-type': (el) => {
    readForm(); const t = el.dataset.v; if (t === F.type) return;
    F.type = t; const c = catsOf(t)[0]; F.cat = t === 'task' ? (cat(DB.lastTaskCat) || c).id : c.id;
    if (t === 'event') { if (!F.date) F.date = UI.date; if (!F.start) { F.start = '09:00'; F.end = '10:00'; } } else { F.start = null; F.end = null; }
    sheetItem();
  },
  'f-timed': () => {
    readForm();
    if (F.start) { F.start = null; F.end = null; } else { const h = F.date === today() ? nextHour() : 9; F.start = pad(h) + ':00'; F.end = pad(Math.min(23, h + 1)) + ':00'; }
    sheetItem();
  },
  'f-nodate': () => { readForm(); F.date = null; F.rem = null; sheetItem(); },
  'f-setdate': () => { readForm(); F.date = UI.view === 'tasks' ? today() : UI.date; sheetItem(); },
  'f-cat': (el) => { readForm(); F.cat = el.dataset.id; sheetItem(); },
  'f-newcat': () => { readForm(); openCat(null, F.type, F); },
  'f-rem': (el) => { readForm(); F.rem = el.dataset.v === '' ? null : Number(el.dataset.v); sheetItem(); },
  'f-save': () => saveItem(),
  'f-ics': () => { readForm(); openICS(Object.assign({}, F, { id: F.id })); },
  'f-del': () => {
    if (DEL_ARM !== F.id) { DEL_ARM = F.id; readForm(); sheetItem(); const b = document.querySelector('[data-action="f-del"]'); if (b) b.textContent = 'לחץ שוב לאישור המחיקה'; return; }
    const i = DB.items.findIndex((x) => x.id === F.id); const it = DB.items[i];
    if (i >= 0) DB.items.splice(i, 1);
    save(); closeSheet(); render();
    if (it) toast('נמחק', 'ביטול', () => { DB.items.splice(i, 0, it); save(); render(); });
  },
  'c-color': (el) => { readCat(); CF.color = Number(el.dataset.v); sheetCat(); },
  'c-icon': (el) => { readCat(); CF.icon = el.dataset.v; sheetCat(); },
  'c-save': () => saveCat(),
  'c-del': () => delCat()
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  if (el.id === 'backdrop' && e.target !== el) return;
  const fn = ACT[el.dataset.action]; if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('submit', (e) => {
  if (e.target.dataset.form !== 'quick') return;
  e.preventDefault();
  const inp = $('#quick'); const t = inp.value.trim(); if (!t) return;
  const c = cat(DB.lastTaskCat) || catsOf('task')[0];
  DB.items.push({ id: uid(), type: 'task', title: t, date: today(), start: null, end: null, cat: c ? c.id : null, done: false, rem: null, notes: '' });
  save(); render(); const q = $('#quick'); if (q) q.focus(); toast('נוספה משימה להיום');
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#backdrop').classList.contains('open')) closeSheet(); });

/* swipe between periods (RTL: swipe right = next) */
let sx = 0, sy = 0, st = 0;
$('#view').addEventListener('touchstart', (e) => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; st = Date.now(); }, { passive: true });
$('#view').addEventListener('touchend', (e) => {
  if (!['month', 'week', 'day'].includes(UI.view)) return;
  if (e.target.closest('.chips,.tl')) return;
  const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
  if (Date.now() - st < 600 && Math.abs(dx) > 60 && Math.abs(dy) < 50) shift(dx > 0 ? 1 : -1);
}, { passive: true });

let lastDay = today();
document.addEventListener('visibilitychange', () => { if (!document.hidden && today() !== lastDay) { lastDay = today(); UI.date = today(); render(); } });
let rT = null;
window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { UI.monthLines = 0; if (!$('#backdrop').classList.contains('open')) render(); }, 150); });
setInterval(() => { if (UI.view === 'day' && !document.hidden && !$('#backdrop').classList.contains('open')) { const n = document.querySelector('.now'); if (n) { const m = new Date().getHours() * 60 + new Date().getMinutes(); n.style.top = m / 60 * HOUR_PX + 'px'; } } }, 60000);

render();
if ('serviceWorker' in navigator && location.protocol === 'https:') { navigator.serviceWorker.register('sw.js').catch(() => {}); }
</script>
</body>
</html>
